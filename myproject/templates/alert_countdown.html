<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Emergency Alert</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }

      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      h1 {
        font-size: 36px;
        color: #ff8fa3;
        margin-bottom: 10px;
      }

      p {
        font-size: 18px;
        color: #eee;
        margin-bottom: 20px;
      }

      .timer {
        font-size: 64px;
        font-weight: bold;
        color: #ffeb3b;
        margin: 20px 0;
      }

      .btn {
        background-color: #ff4e50;
        color: #fff;
        font-weight: bold;
        padding: 15px 30px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .btn:hover {
        background-color: #e60023;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚨 Emergency Detected</h1>
      <p>We will notify your emergency contact in:</p>
      <div class="timer" id="countdown">10</div>

      <button class="btn" onclick="cancelAlert()">Cancel Alert</button>
    </div>

    <script>
      let timeLeft = 10;
      const countdownEl = document.getElementById("countdown");
      const alertID = "{{ alert_id }}";

      const interval = setInterval(() => {
        timeLeft--;
        countdownEl.innerText = timeLeft;
        if (timeLeft === 0) {
          clearInterval(interval);
          sendAlert();
        }
      }, 1000);

      function sendAlert() {
        fetch("/confirm-alert/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ alert_id: alertID }),
        })
          .then((res) => res.json())
          .then((data) => {
            alert("Alert sent to emergency contact!");
            window.location.href = "/dashboard/";
          });
      }

      function cancelAlert() {
        clearInterval(interval);
        alert("Emergency alert canceled.");
        window.location.href = "/cancelled/";
      }
    </script>
  </body>
</html>
